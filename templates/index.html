<!-- ============================================================ -->
<!-- index.html — Homepage / Dashboard                            -->
<!-- ============================================================ -->
<!-- Shows task stats and quick navigation links.                  -->
<!-- base.html is used as the parent template                     -->
<!-- ============================================================ -->

{% extends "base.html" %}

{% block content %}


<h1>Welcome to TaskFlow</h1>
<p>Your personal task management system.</p>

<!-- Task stats cards -->
<div class="stats">
    <div class="stat-card">
        <h3>{{ counts.total }}</h3>
        <p>Total Tasks</p>
    </div>
    <div class="stat-card">
        <h3>{{ counts.pending }}</h3>
        <p>Pending</p>
    </div>
    <div class="stat-card">
        <h3>{{ counts.in_progress }}</h3>
        <p>In Progress</p>
    </div>
    <div class="stat-card">
        <h3>{{ counts.completed }}</h3>
        <p>Completed</p>
    </div>
</div>

<!-- Quick navigation buttons -->
<div class="actions">
    <a href="{{ url_for('tasks') }}" class="btn">View Tasks</a>
    <a href="{{ url_for('add_task') }}" class="btn">Add Task</a>
</div>

{% endblock %}
