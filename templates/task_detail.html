<!-- ============================================================ -->
<!-- task_detail.html — Show One Task's Details                    -->
<!-- ============================================================ -->
<!-- Displays all information about a single task.                -->
<!-- The 'task' variable comes from app.py:                       -->
<!--   task = get_task_by_id(task_id)                              -->
<!--   return render_template("task_detail.html", task=task)       -->
<!-- ============================================================ -->

{% extends "base.html" %}

{% block content %}

<h1>Task #{{ task.id }}</h1>
<!-- Shows the task ID in the heading, e.g., "Task #3" -->

<div class="detail">
    <p><strong>Title:</strong> {{ task.title }}</p>

    <p><strong>Description:</strong> {{ task.description or "No description" }}</p>
    <!-- 
        task.description or "No description"
        If description is empty/None, show "No description" instead of blank space.
        The "or" works like a fallback value.
    -->

    <p><strong>Status:</strong> <span class="badge {{ task.status }}">{{ task.status }}</span></p>
    <!-- Badge with color: pending=yellow, in_progress=blue, completed=green -->
</div>

<!-- ===== Action Buttons ===== -->
<div class="actions">
    <a href="{{ url_for('edit_task', task_id=task.id) }}" class="btn">Edit</a>
    <!-- Goes to the edit form for this task -->

    <a href="{{ url_for('delete_task_route', task_id=task.id) }}" class="btn btn-danger"
       onclick="return confirm('Delete this task?')">Delete</a>
    <!-- Red button. Shows confirmation popup before deleting. -->

    <a href="{{ url_for('tasks') }}" class="btn">Back to Tasks</a>
    <!-- Goes back to the full task list -->
</div>

{% endblock %}
