<!-- ============================================================ -->
<!-- users.html — List All Users                                  -->
<!-- ============================================================ -->
<!-- Displays all users in a table.                               -->
<!-- The 'users' variable comes from app.py:                      -->
<!--   return render_template("users.html", users=all_users)      -->
<!-- ============================================================ -->

{% extends "base.html" %}

{% block content %}
<h1>All Users</h1>

<a href="{{ url_for('add_user') }}" class="btn">Add New User</a>

<!-- Check if there are any users to display -->
{% if users %}
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        <!-- Loop through each user and create a table row -->
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <!-- {{ user.id }} prints the user's ID from the database -->

            <td>{{ user.name }}</td>
            <!-- {{ user.name }} prints the user's name -->

            <td>{{ user.email }}</td>
            <!-- {{ user.email }} prints the user's email -->
        </tr>
        {% endfor %}
        <!-- {% endfor %} closes the for loop -->
    </tbody>
</table>

{% else %}
<!-- This shows when there are no users in the database -->
<p>No users yet. Add one!</p>
{% endif %}

{% endblock %}
