<!-- ============================================================ -->
<!-- base.html — The Parent Template                              -->
<!-- ============================================================ -->
<!-- Every other template "extends" this file.                     -->
<!-- This means: base.html provides the common structure           -->
<!-- (navigation, head, body), and child templates fill in         -->
<!-- the {% block content %} section with their own content.       -->
<!--                                                               -->
<!-- This is called TEMPLATE INHERITANCE (like a parent-child).    -->
<!-- It prevents us from repeating the nav bar in every HTML file. -->
<!-- ============================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- charset="UTF-8" tells the browser to support all characters (emojis, symbols) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page responsive on mobile devices -->

    <title>TaskFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- 
        url_for('static', filename='style.css') generates the URL to our CSS file.
        It looks inside the static/ folder for style.css.
        Result: /static/style.css
        Why use url_for? It always generates the correct path, even if you move files.
    -->
</head>
<body>

    <!-- ===== Navigation Bar ===== -->
    <!-- This appears on EVERY page because it's in base.html -->
    <nav>
        <a href="{{ url_for('home') }}" class="logo">TaskFlow</a>
        <!-- url_for('home') generates the URL for the home() function in app.py → "/" -->

        <div>
            <a href="{{ url_for('tasks') }}">Tasks</a>
            <!-- url_for('tasks') → "/tasks" -->

            <a href="{{ url_for('add_task') }}">Add Task</a>
            <!-- url_for('add_task') → "/tasks/add" -->

            <a href="{{ url_for('users') }}">Users</a>
            <!-- url_for('users') → "/users" -->

            <a href="{{ url_for('add_user') }}">Add User</a>
            <!-- url_for('add_user') → "/users/add" -->
        </div>
    </nav>

    <!-- ===== Main Content Area ===== -->
    <div class="container">

        <!-- ===== Flash Messages ===== -->
        <!-- 
            Flash messages are one-time notifications.
            In app.py, we write: flash("Task created!", "success")
            Here, we display them. They appear ONCE and disappear on the next page load.
            
            get_flashed_messages(with_categories=true) returns a list of (category, message) pairs.
            category = "success" or "error" — used for green or red styling.
        -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                    <!-- 
                        {{ category }} becomes "success" or "error" → CSS class for color
                        {{ message }} becomes "Task created!" → the actual text shown
                    -->
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- ===== Page Content ===== -->
        <!-- 
            {% block content %}{% endblock %}
            
            This is a PLACEHOLDER. Each child template replaces this block
            with its own content. For example:
            
            In index.html:
                {% block content %}
                    <h1>Welcome to TaskFlow</h1>
                {% endblock %}
            
            The result: base.html's structure + index.html's content = complete page.
        -->
        {% block content %}{% endblock %}

    </div>
</body>
</html>
